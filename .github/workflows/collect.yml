name: Collect parking data

# GitHub Actions cron runs in UTC and cannot express "America/New_York,
# DST-aware" directly, so this schedule is deliberately WIDER than the
# real 7:00 AM-9:00 PM ET window (covering both EST and EDT offsets, and
# split across the UTC day boundary for Friday evenings). The real,
# authoritative Mon-Fri 7am-9pm America/New_York check happens inside
# /api/collect itself — any tick outside the true window is a cheap
# no-op (skipped: true, no database write), never a bad reading.
#
# Note: GitHub's scheduler does not guarantee exact-minute delivery —
# under load it can be delayed by a few minutes. That shows up as a small
# gap in the data, which is expected and handled (see README "Data
# quality"), not silently papered over.
on:
  schedule:
    # 11:00-23:59 UTC, Mon-Fri (UTC weekday) -> covers 7:00 AM through
    # early evening ET on both EST (UTC-5) and EDT (UTC-4).
    - cron: "* 11-23 * * 1-5"
    # 00:00-02:00 UTC, Tue-Sat (UTC weekday) -> covers Mon-Fri evening ET
    # (up to 9:00 PM ET), which lands after UTC midnight and therefore on
    # the *next* UTC calendar day/weekday.
    - cron: "* 0-2 * * 2-6"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

concurrency:
  group: jmu-parking-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/collect
        run: |
          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/collect" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 30)
          echo "HTTP $http_status"
          cat /tmp/response.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Collector endpoint returned $http_status"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
